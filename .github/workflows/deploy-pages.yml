name: deploy-pages
# Builds the interactive (WASM) take-home from its .py source and publishes to GitHub Pages.
# Nothing derived (the HTML or the 27 MB runtime) is committed: CI regenerates it on every push.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install marimo uv   # uv is required by marimo's html-wasm export
      - name: Export the interactive modules to _site
        run: |
          python tools/split_02.py   # regenerate the six Part files + lab02.py from the single source module
          mkdir -p _site/prompt-injection
          # run from notebooks/ so the part files resolve their shared `lab02` import (marimo bundles it)
          ( cd notebooks
            python -m marimo export html-wasm 04_poisoned_retrieval_marimo.py -o ../_site/index.html --mode run --no-show-code
            python -m marimo export html-wasm 02_prompt_injection_marimo.py -o ../_site/prompt-injection/index.html --mode run --no-show-code
            for n in 1 2 3 4 5 6; do
              python -m marimo export html-wasm part$n.py -o ../_site/prompt-injection/p$n/index.html --mode run --no-show-code
            done )
          cp -r course _site/course   # the course shell (sidebar, progress, quizzes) that wraps the lessons
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
