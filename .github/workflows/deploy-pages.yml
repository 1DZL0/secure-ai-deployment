name: deploy-pages
# Builds the interactive (WASM) take-home from its .py source and publishes to GitHub Pages.
# Nothing derived (the HTML or the 27 MB runtime) is committed: CI regenerates it on every push.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install marimo==0.25.1 uv   # uv is required by marimo's html-wasm export (and to bundle notebooks/koda_lab.py as a wheel)
      - run: python notebooks/koda_lab.py     # the shared lab's self-check, no model needed
      - run: python notebooks/koda_toolbox.py # module 03's engine and exercises: model answers pass, wrong answers fail
      - name: Export the interactive modules to _site
        # Run from notebooks/: marimo resolves a notebook's css_file (../course/course.css) against the working directory
        # in an html-wasm export, so exporting from the repo root would silently drop the course stylesheet.
        run: |
          mkdir -p _site/prompt-injection _site/foundations _site/tools-agency _site/benchmark
          cd notebooks
          python -m marimo export html-wasm 04_poisoned_retrieval_marimo.py \
            -o ../_site/index.html --mode run --no-show-code
          python -m marimo export html-wasm 02_prompt_injection_marimo.py \
            -o ../_site/prompt-injection/index.html --mode run --no-show-code
          python -m marimo export html-wasm 01_foundations_marimo.py \
            -o ../_site/foundations/index.html --mode run --no-show-code
          python -m marimo export html-wasm 03_tools_agency_marimo.py \
            -o ../_site/tools-agency/index.html --mode run --no-show-code
          python -m marimo export html-wasm benchmark_marimo.py \
            -o ../_site/benchmark/index.html --mode run --no-show-code
          cd ..
          grep -q "sad-head" _site/foundations/index.html   # fail the build if the stylesheet was not inlined
          cp -r course _site/course   # the course shell (sidebar, progress, quizzes) and course.css that wrap the modules
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
