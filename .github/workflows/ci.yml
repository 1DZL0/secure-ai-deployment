name: injection-eval
# Runs the deterministic policy / injection eval suite on every push and PR.
# No model, no API key, no credits: it dispatches each attack vector straight at the
# hardened policy layer and fails if any one is no longer blocked.
on:
  push:
  pull_request:
jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python test_lab.py
      - run: python notebooks/koda_lab.py   # the browser lab's policy layer and graders
      - run: python notebooks/koda_toolbox.py   # module 03's toolbox lab: model answers pass, wrong answers fail
      - run: python notebooks/koda_answer.py    # module 05's engine: leak grader, renderer oracle, exercises, recorded fingerprints
      - run: python notebooks/koda_retrieval.py # module 04's engine: the pipeline stages, model answers pass, wrong answers fail
      - run: python notebooks/koda_sandbox.py   # module 06's engine: the model of a box, the six payloads, model answers pass, wrong answers fail
