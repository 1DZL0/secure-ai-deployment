<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure AI Deployment, a hands-on course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="course.css">
</head>
<body class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#/" aria-label="Back to the course home">
      <div class="name">Secure AI Deployment</div>
      <p>AI security, hands-on</p>
      <p>Break it, then bound it. Runs in your browser.</p>
    </a>
    <div class="prog">
      <div class="bar"><i id="sidefill"></i></div>
      <div id="prog"></div>
    </div>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="nav" onclick="toggleMenu()">&#9776; Lessons &amp; tools</button>
    <nav id="nav"></nav>
    <div class="tools">
      <p class="group-h">Tools</p>
      <div id="toolnav"></div>
    </div>
    <div class="refs">
      <p class="group-h" style="padding:0 0 8px;">Standards &amp; reference</p>
      <a href="https://genai.owasp.org/llm-top-10/" target="_blank" rel="noopener">OWASP LLM Top 10 <span class="ext">&#8599;</span></a>
      <a href="https://genai.owasp.org/2025/12/09/owasp-top-10-for-agentic-applications-the-benchmark-for-agentic-security-in-the-age-of-autonomous-ai/" target="_blank" rel="noopener">OWASP Agentic Top 10 <span class="ext">&#8599;</span></a>
      <a href="#/lesson/foundations">The method: bound the action</a>
    </div>
  </aside>

  <main>
    <div class="wrap" id="view"></div>
  </main>

<script>
const MODULES = [
  {
    num: "01",
    id: "foundations",
    title: "Foundations",
    subtitle: "How agents work, and why they're attackable",
    blurb: "What an agent actually is, the one principle every later module rests on, and how to spot a dangerous agent before any attack.",
    url: "../foundations/",
    minutes: 25,
    quiz: [
      { q: "What are the three parts of an AI agent?",
        options: [
          "A model, a database, and a user interface",
          "A model, a set of tools, and a loop that decides when to run them",
          "A prompt, a fine-tune, and a vector store" ],
        answer: 1,
        why: "The loop sends the conversation and a tool menu; the model answers or asks for a tool; your code decides whether to run it." },
      { q: "Why can an agent always be fooled by a malicious input?",
        options: [
          "Models are not trained well enough yet",
          "Instructions and data reach the model as one token stream, with no typed channel separating command from data",
          "It only happens with cheap models" ],
        answer: 1,
        why: "There is no boundary inside the stream, so any text can be read as an instruction. You bound the action instead of trusting the model." },
      { q: "An agent reads untrusted email, can open a customer's private records, and can send email anywhere. What does the lethal trifecta say?",
        options: [
          "It is fine as long as the model is aligned",
          "All three legs are present, so one crafted input can exfiltrate data; drop a leg or add a human",
          "Only two of the legs ever matter" ],
        answer: 1,
        why: "Untrusted input + private data + external comms is the lethal trifecta (Willison); Meta's Rule of Two says keep it to at most two per session." },
    ],
  },
  {
    num: "02",
    id: "prompt-injection",
    title: "Prompt injection",
    subtitle: "When data becomes a command",
    blurb: "An agent reads one poisoned record and turns against its operator. Break it, bound it with permissions you flip yourself, then see how real models fare on the benchmark.",
    url: "../prompt-injection/",
    minutes: 80,
    quiz: [
      { q: "Why can't an LLM agent tell a customer's note apart from your real instruction?",
        options: [
          "It is told to ignore customer data",
          "Everything arrives as one undifferentiated token stream, with no typed channel marking command vs data",
          "It only ever trusts the system prompt" ],
        answer: 1,
        why: "There is no typed boundary: any text it reads can be read as an instruction." },
      { q: "We never stopped the model being fooled. So why is the hardened agent safe?",
        options: [
          "The model was retrained to resist",
          "A cleverer system prompt blocks the attack",
          "The policy layer refuses the harmful action regardless of what the model decides" ],
        answer: 2,
        why: "The boundary is a property of the action, enforced outside the model." },
      { q: "The four faces (destruction, exfiltration, persistence, filter-bypass) are each bounded by...",
        options: [
          "The same keyword filter",
          "A different control matched to the action: a read-only credential, an egress allowlist, a gated memory write, and so on",
          "A more capable model" ],
        answer: 1,
        why: "Read the action the agent is about to take, and the boundary follows." },
      { q: "What does the model sweep (the benchmark linked from this lesson) show about relying on a better model as your defence?",
        options: [
          "A good-enough model fully stops prompt injection",
          "Cheaper and older models fall, and even frontier models leak on a harmless-looking exfiltration, so the model is not a boundary",
          "Every model is equally vulnerable to everything" ],
        answer: 1,
        why: "A stronger model raises the bar against crude attacks but never closes the door." },
      { q: "The module's one line: because you cannot stop an AI being tricked, you...",
        options: [
          "Keep trying new system prompts until it stops",
          "Limit what a tricked AI is allowed to reach: a permission, not a cleverer prompt",
          "Stop using agents entirely" ],
        answer: 1,
        why: "Bound the action outside the model; the wording of the injection cannot reach that boundary." },
      { q: "A vendor says its prompt-injection classifier blocks 99% of attacks. What is the right reading?",
        options: [
          "It is solved, so ship it as your boundary",
          "It blocks 99% of what the vendor tried: test it against an adaptive attacker with many attempts, and keep the boundary on the action",
          "Classifiers never work, so ignore them" ],
        answer: 1,
        why: "In The Attacker Moves Second, most published defences were bypassed more than 90% of the time once the attacker adapted. A reducer is worth having under a boundary, not instead of one." },
      { q: "An agent's plan is fixed in code before it reads any untrusted text. What can a planted note still do?",
        options: [
          "Add a call to a tool that is not in the plan",
          "Misuse a tool that is in the plan, through its arguments or content",
          "Nothing at all: plan-then-execute is a complete defence" ],
        answer: 1,
        why: "The plan removes what is not in it. It does not protect what it legitimately includes, so arguments and content still need a boundary." },
    ],
  },
  {
    num: "03",
    id: "tools-agency",
    title: "Tools & excessive agency",
    subtitle: "The agent's own tools as the risk",
    blurb: "Why did the assistant hold that power at all? Audit a toolbox, write the credential, the object check and the approval gate yourself, break a log tool's flag check, and meet the tool supply chain, with documented cases beside every layer.",
    url: "../tools-agency/",
    minutes: 70,
    quiz: [
      { q: "An assistant is asked to reply to one customer. It holds ten tools and a key with nine scopes. What is the first fix?",
        options: [
          "Write a stricter system prompt about which tools to use",
          "Remove the tools the task does not need and mint a key for the task",
          "Add a classifier over the customer's note" ],
        answer: 1,
        why: "A tool that is absent cannot be asked for, and a key without the scope cannot use it. The prompt and the classifier only lower the odds." },
      { q: "Working for Alice at one company, the assistant looks up an account that belongs to another company, using its own admin key. Which layer is the one that can see that?",
        options: [
          "The scope on the key, because it checks accounts:read",
          "The object check in the tool, comparing the account's tenant with the tenant the call is for",
          "The system prompt" ],
        answer: 1,
        why: "The scope was legitimate for the reply. Only a check on the object, using a tenant that comes from the credential and not from anything the model wrote, can see whose account it is." },
      { q: "An approval gate asks a person about every tool call. What goes wrong, and what is the fix?",
        options: [
          "People approve nearly every prompt and stop reading; hold only what cannot be undone, and show the literal call",
          "Models ignore approval prompts, so remove them",
          "Approvals are slower than a classifier, so replace them with one" ],
        answer: 0,
        why: "A gate is only a control while it is rare and readable. A model-written summary of a steered call reads like all the others." },
      { q: "A log-search tool is protected by a check that refuses the text '--exec'. Why does it fail?",
        options: [
          "The tool's parser accepts abbreviations and bundled short options, so the dangerous option has other spellings",
          "Text cannot be compared reliably",
          "Attackers do not use command-line flags" ],
        answer: 0,
        why: "A rule written on the text has to guess every spelling the parser accepts. An allowlist of whole tokens, or a typed tool with no flags string, removes the guess." },
      { q: "You approved a third-party tool's description last week, and today it changed. What does pinning its hash catch?",
        options: [
          "The change after approval, but not a tool that was already poisoned when you approved it",
          "Every poisoned tool, however and whenever it was written",
          "Nothing, because descriptions are not code" ],
        answer: 0,
        why: "A pin bounds change. A reach limit, such as a mail tool that only reaches your own domain, is what catches the tool that was poisoned on day one." },
      { q: "The module's one line is...",
        options: [
          "Give the agent every tool and rely on the logs",
          "Authority is a property of the call, not of the agent: shrink the toolbox, scope the credential to the task and the person, and check every use outside the model",
          "Use the most capable model and trust its judgement about tools" ],
        answer: 1,
        why: "Each clause is a layer you built: the tool diet, the credential and the object check, and the argument check and the gate." },
    ],
  },
  {
    num: "04",
    id: "poisoned-retrieval",
    title: "Poisoned retrieval",
    subtitle: "When the document is the attacker",
    blurb: "A search-powered assistant pulls up a booby-trapped document and does what it says. The same bug as prompt injection, arriving through retrieval.",
    url: "../",
    minutes: 30,
    quiz: [
      { q: "A RAG assistant leaks a secret after retrieving a web-imported document. The root cause is:",
        options: [
          "A weak admin password",
          "Retrieved text was read and obeyed as an instruction",
          "The user explicitly asked for the secret" ],
        answer: 1,
        why: "Retrieval is an untrusted input channel; the document issued an order the assistant followed." },
      { q: "The real boundary against poisoned retrieval is:",
        options: [
          "A keyword blocklist on every document",
          "Bounding what a retrieved document can trigger (gate the action), not filtering the text",
          "Using a larger model" ],
        answer: 1,
        why: "You cannot reliably keep the poison out; you bound what a fooled assistant is allowed to do." },
      { q: "In the EchoLeak class, the stolen data leaves through...",
        options: [
          "A visible error message the user reads",
          "A link or image URL the answer renders, which the client loads automatically",
          "The user manually copying it out" ],
        answer: 1,
        why: "Filter outbound links and images in answers, and keep secrets out of the answer path." },
    ],
  },
  {
    num: "05",
    coming: true,
    title: "Data leakage & output handling",
    subtitle: "Keeping secrets out of the answer path",
    blurb: "Sensitive data crossing the egress boundary in an answer, a link, or an image, and how to stop it (the EchoLeak class).",
  },
  {
    num: "06",
    coming: true,
    title: "Isolated code execution",
    subtitle: "Sandboxing what the agent runs",
    blurb: "When the agent writes and runs code, how to keep that execution inside a box it cannot break out of.",
  },
  {
    num: "07",
    coming: true,
    title: "Memory & persistence",
    subtitle: "When an attack outlives the session",
    blurb: "A planted memory re-fires an attack in later sessions with no poison in sight: gating and reviewing durable writes.",
  },
  {
    num: "08",
    coming: true,
    title: "Multi-agent systems",
    subtitle: "Injection that spreads between agents",
    blurb: "One agent's injected output becomes another's instruction. No transitive trust, signed messages, and bounded blast radius.",
  },
  {
    num: "09",
    coming: true,
    title: "Monitoring, evaluation & governance",
    subtitle: "Detect, respond, and the rules you answer to",
    blurb: "Logging and anomaly detection, injection eval suites in CI, incident response, and OWASP / NIST / EU AI Act obligations.",
  },
];
const LIVE = MODULES.filter(m => !m.coming);
// pages that are tools, not lessons: no number, no quiz, no progress
const TOOLS = {
  benchmark: { title: "Model benchmark", short: "Run the attack set on your own model",
               subtitle: "Run module 02's attack set against your own model, on your own OpenRouter key", url: "../benchmark/",
               note: "Needs an OpenRouter key, which stays in your browser. Give the page a few seconds to boot.", loading: "Loading the benchmark…" },
  cases: { title: "Case library and atlas", short: "54 cases, 23 attack classes, 37 controls",
           subtitle: "Documented cases from 2023 to 2026, the attack classes they fall into and the controls that bound them, each mapped to the layer of Module 03 that would have held",
           url: "cases/", note: "Three tabs: cases, attack classes and controls. Filter and search each one. Every case and class links to its sources, which open in a new tab.",
           loading: "Loading the case library…" },
};

const KEY = "sad-course-progress-v1";
function loadDone(){ try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e){ return new Set(); } }
function saveDone(set){ try { localStorage.setItem(KEY, JSON.stringify([...set])); } catch(e){} }
function isDone(id){ return loadDone().has(id); }
function markDone(id){ const s = loadDone(); s.add(id); saveDone(s); }

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const liveIdx = id => LIVE.findIndex(l => l.id === id);

function renderSidebar(currentId){
  const done = loadDone();
  const doneLive = LIVE.filter(m => done.has(m.id)).length;
  const pct = Math.round(100 * doneLive / MODULES.length);
  document.getElementById("sidefill").style.width = pct + "%";
  const minsLeft = LIVE.filter(m => !done.has(m.id)).reduce((s, m) => s + (m.minutes || 0), 0);
  const timeStr = minsLeft <= 0 ? "all live lessons done"   // nearest half hour, so 90 min reads ~1.5 h, not ~2 h
    : (minsLeft >= 60 ? "~" + Math.round(minsLeft / 30) / 2 + " h left" : "~" + minsLeft + " min left");
  const next = LIVE.find(m => !done.has(m.id));
  document.getElementById("prog").innerHTML =
    `<div class="prog-line">${doneLive} of ${MODULES.length} complete</div><div class="prog-time">${timeStr}</div>`
    + (next ? `<a class="continue" href="#/lesson/${next.id}">Continue: ${esc(next.title)} &rarr;</a>`
            : `<div class="prog-time">You&rsquo;re all caught up</div>`);
  document.getElementById("toolnav").innerHTML = Object.entries(TOOLS).map(([tid, t]) =>
    `<a class="lrow ${currentId === "tool:" + tid ? "active" : ""}" href="#/tool/${tid}">
       <div class="num"></div>
       <div class="meta"><b>${esc(t.title)}</b><span>${esc(t.short)}</span></div>
     </a>`).join("");
  document.getElementById("nav").innerHTML = MODULES.map(m => {
    if (m.coming) return `<div class="lrow coming">
         <div class="num">${m.num}</div>
         <div class="meta"><b>${esc(m.title)}</b><span>${esc(m.subtitle)}</span></div>
       </div>`;
    const d = done.has(m.id);
    return `<a class="lrow ${d?"done":""} ${m.id===currentId?"active":""}" href="#/lesson/${m.id}">
       <div class="num">${d?"&#10003;":m.num}</div>
       <div class="meta"><b>${esc(m.title)}</b><span>${esc(m.subtitle)}</span></div>
     </a>`;
  }).join("");
}

function renderHome(){
  renderSidebar(null);
  const done = loadDone();
  document.getElementById("view").innerHTML =
    `<h1 class="page-title">Secure AI Deployment</h1>
     <p class="page-sub">AI agents get hijacked through the data they read and the tools they hold. This course shows you how, on a
        real agent in your browser, and then how to stop it. Nothing to install.</p>
     <p class="page-meta">Pharos-CY &middot; AI cybersecurity</p>
     <ol class="toc">
       ${MODULES.map(m => {
         if (m.coming) return `<li><div class="row coming">
            <div class="n">${m.num}</div>
            <div class="b"><b>${esc(m.title)}</b><p>${esc(m.blurb)}</p></div>
            <div class="t">Coming soon</div>
          </div></li>`;
         const d = done.has(m.id);
         return `<li><a href="#/lesson/${m.id}">
            <div class="n">${d?"&#10003;":m.num}</div>
            <div class="b"><b>${esc(m.title)}</b><p>${esc(m.blurb)}</p></div>
            <div class="t">${d?"Completed":"~"+m.minutes+" min"}</div>
          </a></li>`;
       }).join("")}
     </ol>`;
}

function renderLesson(id){
  const i = liveIdx(id); if (i < 0) { location.hash = "#/"; return; }
  const l = LIVE[i];
  renderSidebar(id);
  const prev = LIVE[i-1], next = LIVE[i+1];
  document.getElementById("view").innerHTML =
    `<p class="crumbs"><a href="#/">Course</a> &rsaquo; ${esc(l.title)}</p>
     <p class="frame-note">The interactive lesson is embedded below. Give it a few seconds to boot, then work through it.</p>
     <div class="framebox">
       <div class="loading" id="load">Loading the interactive lesson&hellip;</div>
       <iframe src="${l.url}" title="${esc(l.title)}" onload="document.getElementById('load')?.classList.add('gone')"></iframe>
     </div>
     <div class="openlink"><a href="${l.url}" target="_blank" rel="noopener">Open this lesson full-screen &rsaquo;</a></div>
     ${quizHtml(l)}
     <div class="nav">
       <a class="btn" ${prev?`href="#/lesson/${prev.id}"`:"disabled"}>&larr; ${prev?esc(prev.title):"Back"}</a>
       <span id="donestate">${isDone(l.id)?'<span class="done-badge">&#10003; Lesson complete</span>':""}</span>
       <a class="btn primary" ${next?`href="#/lesson/${next.id}"`:'href="#/"'}>${next?"Next: "+esc(next.title)+" &rarr;":"Finish &rarr;"}</a>
     </div>`;
  document.querySelector("main").scrollTop = 0; window.scrollTo(0,0);
}

function renderTool(id){
  const t = TOOLS[id]; if (!t) { location.hash = "#/"; return; }
  renderSidebar("tool:" + id);
  document.getElementById("view").innerHTML =
    `<p class="crumbs"><a href="#/">Course</a> &rsaquo; ${esc(t.title)}</p>
     <p class="frame-note">${esc(t.note)}</p>
     <div class="framebox">
       <div class="loading" id="load">${esc(t.loading)}</div>
       <iframe src="${t.url}" title="${esc(t.title)}" onload="document.getElementById('load')?.classList.add('gone')"></iframe>
     </div>
     <div class="openlink"><a href="${t.url}" target="_blank" rel="noopener">Open full-screen &rsaquo;</a></div>`;
  document.querySelector("main").scrollTop = 0; window.scrollTo(0,0);
}

function quizHtml(l){
  return `<div class="quiz">
    <h2>Checkpoint <span class="qcount">${l.quiz.length} questions</span></h2>
    <p class="qp">Answer all ${l.quiz.length} to mark the lesson complete. Your progress is remembered on this device.</p>
    ${l.quiz.map((q,qi) =>
      `<div class="q" data-ans="${q.answer}" data-l="${l.id}">
         <p>${qi+1}. ${esc(q.q)}</p>
         ${q.options.map((o,oi)=>`<button type="button" class="opt" onclick="pick(this,${oi})">${esc(o)}</button>`).join("")}
         <div class="qfb" data-why="${esc(q.why)}"></div>
       </div>`).join("")}
  </div>`;
}

function pick(el, oi){
  const q = el.closest(".q"); if (q.dataset.locked) return;
  const ans = +q.dataset.ans;
  q.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  const fb = q.querySelector(".qfb");
  if (oi === ans){
    el.classList.add("correct"); q.dataset.locked = "1";
    fb.innerHTML = "&#10003; " + q.querySelector(".qfb").dataset.why;
    maybeComplete(q.dataset.l);
  } else {
    el.classList.add("wrong");
    fb.textContent = "Not quite, try another.";
    q.querySelectorAll(".opt").forEach(o=>o.classList.remove("disabled"));
    el.classList.add("disabled");
  }
}

function maybeComplete(lid){
  const qs = [...document.querySelectorAll(`.q[data-l="${lid}"]`)];
  if (qs.length && qs.every(q => q.dataset.locked)){
    markDone(lid);
    renderSidebar(lid);
    const ds = document.getElementById("donestate");
    if (ds) ds.innerHTML = '<span class="done-badge">&#10003; Lesson complete</span>';
  }
}

function toggleMenu(force){
  // the phone-width menu (lesson list, Tools, Standards); a no-op visually on desktop, where they are always shown
  const side = document.getElementById("side"), btn = document.getElementById("menu-toggle");
  const open = side.classList.toggle("open", force);
  btn.setAttribute("aria-expanded", String(open));
  btn.innerHTML = open ? "&#10005; Close" : "&#9776; Lessons &amp; tools";
}

function route(){
  toggleMenu(false);   // close the phone menu after any navigation
  const h = location.hash || "#/";
  const t = h.match(/^#\/tool\/(.+)$/);
  if (t) { renderTool(decodeURIComponent(t[1])); return; }
  const m = h.match(/^#\/lesson\/(.+)$/);
  if (m) renderLesson(decodeURIComponent(m[1])); else renderHome();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
