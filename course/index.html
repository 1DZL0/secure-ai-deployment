<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure AI Deployment, a hands-on course</title>
<style>
  :root{
    /* Pharos-CY brand: deep teal-blue (the lighthouse) + green (the Cyprus map) */
    --slate:#0f3a42; --steel:#1f93ab; --steel-light:#6cc3d6; --green:#5a9e3c;
    --amber:#b07d2b; --red:#c8553d; --ink:#1b2a30; --muted:#5e7278; --faint:#9aa8ad;
    --line:#dde4e7; --panel:#fafcfc; --bg:#ffffff;
    --sans:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);display:flex;min-height:100%}
  a{color:var(--steel);text-decoration:none}

  /* sidebar */
  .side{width:272px;flex:0 0 272px;background:var(--slate);color:#eef2f3;display:flex;flex-direction:column;
        position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .brand{padding:18px 20px 12px}
  .side .eyebrow{color:var(--steel-light);font:700 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase}
  .side .brand h1{font-size:17px;margin:7px 0 2px;line-height:1.2;color:#fff}
  .side .brand p{font-size:12px;color:#9fb0b6;margin:0}
  .side .bar{height:5px;background:#1b4a54;border-radius:3px;margin:12px 20px 4px;overflow:hidden}
  .side .bar > i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .side .barlbl{color:#9fb0b6;font:600 10.5px var(--sans);letter-spacing:.04em;padding:0 20px 8px}
  nav{padding:6px 10px 20px}
  .lrow{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border-radius:9px;cursor:pointer;color:#cdd8db}
  .lrow:hover{background:#17424b}
  .lrow.active{background:#17424b}
  .lrow .num{flex:0 0 22px;height:22px;border-radius:50%;background:#1b4a54;color:#cdd8db;display:flex;
             align-items:center;justify-content:center;font:700 11px var(--sans)}
  .lrow.done .num{background:var(--green);color:#fff}
  .lrow .meta b{display:block;font:600 13px var(--sans);color:#eef2f3}
  .lrow .meta span{display:block;font:12px var(--sans);color:#9fb0b6;margin-top:1px}

  /* main */
  main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
  .wrap{max-width:900px;width:100%;margin:0 auto;padding:30px 28px 60px}

  /* home */
  .hero{background:var(--slate);border-radius:14px;padding:28px 30px;color:#fff;box-shadow:0 2px 14px rgba(19,38,47,.14)}
  .hero .eyebrow{color:var(--steel-light)}
  .hero h2{font-size:28px;margin:9px 0 8px;line-height:1.15}
  .hero p{color:#b7c4c8;font-size:14.5px;line-height:1.55;max-width:640px;margin:0}
  .cards{display:grid;gap:14px;margin-top:22px}
  .card{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:16px 18px;
        cursor:pointer;background:var(--bg);transition:box-shadow .15s,border-color .15s}
  .card:hover{box-shadow:0 3px 14px rgba(19,38,47,.09);border-color:#c4d2d7}
  .card .n{flex:0 0 40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
           display:flex;align-items:center;justify-content:center;font:700 16px var(--sans);color:var(--steel)}
  .card.done .n{background:var(--green);border-color:var(--green);color:#fff}
  .card .body{flex:1;min-width:0}
  .card .body b{font-size:16px}
  .card .body p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  .card .tag{font:600 11px var(--sans);color:var(--faint);white-space:nowrap}
  .card.done .tag{color:var(--green)}

  /* lesson */
  .crumbs{font:600 12px var(--sans);color:var(--faint);margin-bottom:6px}
  .crumbs a{color:var(--faint)}
  .lhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .lhead h2{font-size:24px;margin:2px 0 2px}
  .lhead .of{font:600 12px var(--sans);color:var(--steel);white-space:nowrap}
  .lsub{color:var(--muted);font-size:14px;margin:0 0 12px}
  .pbar{height:6px;background:#eef2f3;border-radius:3px;overflow:hidden;margin:4px 0 16px}
  .pbar > i{display:block;height:100%;background:var(--steel);transition:width .3s}
  .frame-note{font:12px var(--sans);color:var(--faint);margin:0 0 6px}
  .framebox{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);
            box-shadow:0 2px 10px rgba(19,38,47,.07)}
  iframe{display:block;width:100%;height:78vh;border:0;background:#fff}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
           font:14px var(--sans);background:var(--panel);pointer-events:none;transition:opacity .4s}
  .loading.gone{opacity:0}
  .openlink{text-align:right;margin:6px 2px 0;font:12px var(--sans)}

  /* quiz */
  .quiz{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:22px;background:var(--panel)}
  .quiz h3{margin:0 0 4px;font-size:17px}
  .quiz .qp{color:var(--muted);font-size:13px;margin:0 0 14px}
  .q{margin:0 0 16px}
  .q > p{font-weight:600;font-size:14px;margin:0 0 8px}
  .opt{display:block;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;
       background:#fff;font-size:13.5px;transition:border-color .12s,background .12s}
  .opt:hover{border-color:#c4d2d7}
  .opt.correct{border-color:var(--green);background:#e8f4ee}
  .opt.wrong{border-color:var(--red);background:#fae7e1}
  .opt.disabled{cursor:default;opacity:.85}
  .qfb{font:600 12.5px var(--sans);margin-top:4px;min-height:16px}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);font:600 14px var(--sans);
       padding:10px 18px;border-radius:9px;cursor:pointer;text-decoration:none}
  .btn:hover{border-color:#c4d2d7}
  .btn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
  .btn.primary:hover{background:#17788c}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .done-badge{color:var(--green);font:600 13px var(--sans)}

  .menu-toggle{display:none}
  @media (max-width:820px){
    body{flex-direction:column}
    .side{position:static;width:100%;height:auto;flex:none}
    .side nav{display:none}
    .side.open nav{display:block}
    iframe{height:70vh}
  }
</style>
</head>
<body>
  <aside class="side" id="side">
    <div class="brand">
      <div class="eyebrow">Secure AI Deployment</div>
      <h1>AI security, hands-on</h1>
      <p>Break it, then bound it. Runs in your browser.</p>
    </div>
    <div class="bar"><i id="sidefill"></i></div>
    <div class="barlbl" id="sidelbl">0% complete</div>
    <nav id="nav"></nav>
  </aside>

  <main>
    <div class="wrap" id="view"></div>
  </main>

<script>
const LESSONS = [
  {
    id: "prompt-injection",
    title: "Prompt injection",
    subtitle: "When data becomes a command",
    blurb: "An agent reads one poisoned record and turns against its operator. Build it, break it across real models, and bound it with the one control that holds.",
    url: "../prompt-injection/",
    minutes: 60,
    quiz: [
      { q: "Why can't an LLM agent tell a customer's note apart from your real instruction?",
        options: [
          "It is told to ignore customer data",
          "Everything arrives as one undifferentiated token stream, with no typed channel marking command vs data",
          "It only ever trusts the system prompt" ],
        answer: 1,
        why: "There is no typed boundary: any text it reads can be read as an instruction." },
      { q: "We never stopped the model being fooled. So why is the hardened agent safe?",
        options: [
          "The model was retrained to resist",
          "A cleverer system prompt blocks the attack",
          "The policy layer refuses the harmful action regardless of what the model decides" ],
        answer: 2,
        why: "The boundary is a property of the action, enforced outside the model." },
    ],
  },
  {
    id: "poisoned-retrieval",
    title: "Poisoned retrieval",
    subtitle: "When the document is the attacker",
    blurb: "A search-powered assistant pulls up a booby-trapped document and does what it says. The same bug as prompt injection, arriving through retrieval.",
    url: "../",
    minutes: 30,
    quiz: [
      { q: "A RAG assistant leaks a secret after retrieving a web-imported document. The root cause is:",
        options: [
          "A weak admin password",
          "Retrieved text was read and obeyed as an instruction",
          "The user explicitly asked for the secret" ],
        answer: 1,
        why: "Retrieval is an untrusted input channel; the document issued an order the assistant followed." },
      { q: "The real boundary against poisoned retrieval is:",
        options: [
          "A keyword blocklist on every document",
          "Bounding what a retrieved document can trigger (gate the action), not filtering the text",
          "Using a larger model" ],
        answer: 1,
        why: "You cannot reliably keep the poison out; you bound what a fooled assistant is allowed to do." },
    ],
  },
];

const KEY = "sad-course-progress-v1";
function loadDone(){ try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e){ return new Set(); } }
function saveDone(set){ try { localStorage.setItem(KEY, JSON.stringify([...set])); } catch(e){} }
function isDone(id){ return loadDone().has(id); }
function markDone(id){ const s = loadDone(); s.add(id); saveDone(s); }

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idx = id => LESSONS.findIndex(l => l.id === id);

function renderSidebar(currentId){
  const done = loadDone();
  const pct = Math.round(100 * [...done].filter(id => LESSONS.some(l=>l.id===id)).length / LESSONS.length);
  document.getElementById("sidefill").style.width = pct + "%";
  document.getElementById("sidelbl").textContent = pct + "% complete";
  document.getElementById("nav").innerHTML = LESSONS.map((l,i) =>
    `<div class="lrow ${done.has(l.id)?"done":""} ${l.id===currentId?"active":""}" onclick="location.hash='#/lesson/${l.id}'">
       <div class="num">${done.has(l.id)?"&#10003;":i+1}</div>
       <div class="meta"><b>${esc(l.title)}</b><span>${esc(l.subtitle)}</span></div>
     </div>`).join("");
}

function renderHome(){
  renderSidebar(null);
  const done = loadDone();
  document.getElementById("view").innerHTML =
    `<div class="hero">
       <div class="eyebrow" style="color:var(--steel-light);font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase">Pharos-CY &middot; AI cybersecurity</div>
       <h2>Secure AI Deployment</h2>
       <p>A short, hands-on course on how AI agents get attacked and how you stop them. Every lesson runs in your browser:
          you break a real agent, then build the control that bounds it. No install, no account.</p>
     </div>
     <div class="cards">
       ${LESSONS.map((l,i) =>
         `<div class="card ${done.has(l.id)?"done":""}" onclick="location.hash='#/lesson/${l.id}'">
            <div class="n">${done.has(l.id)?"&#10003;":i+1}</div>
            <div class="body"><b>${esc(l.title)}</b><p>${esc(l.blurb)}</p></div>
            <div class="tag">${done.has(l.id)?"Completed":"~"+l.minutes+" min"}</div>
          </div>`).join("")}
     </div>`;
}

function renderLesson(id){
  const i = idx(id); if (i < 0) { location.hash = "#/"; return; }
  const l = LESSONS[i];
  renderSidebar(id);
  const prev = LESSONS[i-1], next = LESSONS[i+1];
  const pct = Math.round(100 * (i) / LESSONS.length);
  document.getElementById("view").innerHTML =
    `<div class="crumbs"><a href="#/">Course</a> &rsaquo; ${esc(l.title)}</div>
     <div class="lhead"><h2>${esc(l.title)}</h2><div class="of">Lesson ${i+1} of ${LESSONS.length}</div></div>
     <p class="lsub">${esc(l.subtitle)}</p>
     <div class="pbar"><i style="width:${pct}%"></i></div>
     <p class="frame-note">The interactive lesson is embedded below. Give it a few seconds to boot, then work through it.</p>
     <div class="framebox">
       <div class="loading" id="load">Loading the interactive lesson&hellip;</div>
       <iframe src="${l.url}" title="${esc(l.title)}" onload="document.getElementById('load')?.classList.add('gone')"></iframe>
     </div>
     <div class="openlink"><a href="${l.url}" target="_blank" rel="noopener">Open this lesson full-screen &rsaquo;</a></div>
     ${quizHtml(l)}
     <div class="nav">
       <a class="btn" ${prev?`href="#/lesson/${prev.id}"`:"disabled"}>&larr; ${prev?esc(prev.title):"Back"}</a>
       <span id="donestate">${isDone(l.id)?'<span class="done-badge">&#10003; Lesson complete</span>':""}</span>
       <a class="btn primary" ${next?`href="#/lesson/${next.id}"`:'href="#/"'}>${next?"Next: "+esc(next.title)+" &rarr;":"Finish &rarr;"}</a>
     </div>`;
  document.querySelector("main").scrollTop = 0; window.scrollTo(0,0);
}

function quizHtml(l){
  return `<div class="quiz">
    <h3>Checkpoint</h3>
    <p class="qp">Answer both to mark the lesson complete. The sidebar remembers your progress on this device.</p>
    ${l.quiz.map((q,qi) =>
      `<div class="q" data-ans="${q.answer}" data-l="${l.id}">
         <p>${qi+1}. ${esc(q.q)}</p>
         ${q.options.map((o,oi)=>`<div class="opt" onclick="pick(this,${oi})">${esc(o)}</div>`).join("")}
         <div class="qfb" data-why="${esc(q.why)}"></div>
       </div>`).join("")}
  </div>`;
}

function pick(el, oi){
  const q = el.closest(".q"); if (q.dataset.locked) return;
  const ans = +q.dataset.ans;
  q.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  const fb = q.querySelector(".qfb");
  if (oi === ans){
    el.classList.add("correct"); q.dataset.locked = "1";
    fb.style.color = "var(--green)"; fb.innerHTML = "&#10003; " + q.querySelector(".qfb").dataset.why;
    maybeComplete(q.dataset.l);
  } else {
    el.classList.add("wrong");
    fb.style.color = "var(--red)"; fb.textContent = "Not quite, try another.";
    q.querySelectorAll(".opt").forEach(o=>o.classList.remove("disabled"));
    el.classList.add("disabled");
  }
}

function maybeComplete(lid){
  const qs = [...document.querySelectorAll(`.q[data-l="${lid}"]`)];
  if (qs.length && qs.every(q => q.dataset.locked)){
    markDone(lid);
    renderSidebar(lid);
    const ds = document.getElementById("donestate");
    if (ds) ds.innerHTML = '<span class="done-badge">&#10003; Lesson complete</span>';
  }
}

function route(){
  const h = location.hash || "#/";
  const m = h.match(/^#\/lesson\/(.+)$/);
  if (m) renderLesson(decodeURIComponent(m[1])); else renderHome();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
